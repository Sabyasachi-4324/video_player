spring.application.name=sync-player
server.port=${PORT:8080}

server.address=0.0.0.0

# TLS is disabled for local development. Enable it in production with a PKCS12 keystore.
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEY_STORE:}
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=${SSL_KEY_STORE_TYPE:PKCS12}
server.ssl.key-alias=${SSL_KEY_ALIAS:sync-player}

# Required when TLS is terminated by a reverse proxy such as Nginx or a cloud load balancer.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}
