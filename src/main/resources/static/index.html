<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Couple Video Player - Watch Together</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0f1014;
            --panel-color: #181a20;
            --accent-color: #e11d48;
            --text-color: #e5e7eb;
            --error-color: #ef4444;
            --success-color: #10b981;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* HEADER */
        header {
            width: 100%;
            padding: 10px 0;
            background: rgba(24, 26, 32, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #333;
            position: fixed;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 5%;
            padding-right: 5%;
            box-sizing: border-box;
        }

        .logo {
            font-weight: 800;
            font-size: 1.3rem;
            letter-spacing: -1px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .logo span {
            color: var(--accent-color);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .status-dot {
            height: 10px;
            width: 10px;
            background-color: #555;
            border-radius: 50%;
            display: inline-block;
            margin-right: 10px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            transition: background-color 0.3s;
        }

        .status-dot.online {
            background-color: var(--success-color);
            box-shadow: 0 0 8px var(--success-color);
        }

        .status-dot.offline {
            background-color: var(--error-color);
            box-shadow: 0 0 8px var(--error-color);
        }

        .user-welcome {
            font-size: 0.8rem;
            color: #888;
        }

        .user-welcome b {
            color: white;
        }

        /* CONTAINER */
        .container {
            margin-top: 80px;
            width: 95%;
            max-width: 1400px;
            display: flex;
            gap: 15px;
            justify-content: center;
            height: calc(100vh - 100px);
            transition: 0.3s;
        }

        /* LOGIN CARD */
        #login-screen {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 200;
            background: var(--panel-color);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #333;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #252830;
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-size: 1rem;
            transition: transform 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: var(--accent-color);
            color: white;
        }

        .btn-secondary {
            background: #374151;
            color: white;
        }

        /* MODAL */
        #welcome-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.5s ease-out;
        }

        .modal-content {
            background: var(--panel-color);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #333;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            animation: slideUp 0.5s ease-out;
        }

        .modal-content h1 {
            margin-bottom: 10px;
            font-size: 2rem;
        }

        .modal-content p {
            color: #aaa;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .owner-badge {
            background: rgba(225, 29, 72, 0.1);
            color: var(--accent-color);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
        }

        /* PLAYER UI */
        #player-ui {
            display: flex;
            width: 100%;
            gap: 15px;
            height: 100%;
        }

        .video-section {
            flex: 3;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        /* SIDEBAR (Structure) */
        .sidebar-section {
            flex: 1;
            max-width: 350px;
            min-width: 250px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: 100%;
            overflow: hidden;
        }

        #video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: black;
            aspect-ratio: 16/9;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ANIMATIONS */
        #hearts-container {
            position: absolute;
            bottom: 0;
            right: 20px;
            width: 150px;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 20;
        }

        .floating-emoji {
            position: absolute;
            bottom: -50px;
            font-size: 2.5rem;
            animation: floatUp 3s cubic-bezier(0.45, 0.05, 0.55, 0.95) forwards;
            opacity: 0;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.5) rotate(0deg);
                opacity: 0;
            }

            20% {
                opacity: 1;
                transform: translateY(-50px) scale(1.2) rotate(-10deg);
            }

            100% {
                transform: translateY(-500px) scale(1) rotate(20deg);
                opacity: 0;
            }
        }

        /* SIDEBAR BOXES (Common) */
        .sidebar-box {
            background: var(--panel-color);
            border-radius: 12px;
            border: 1px solid #333;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .sidebar-box h3 {
            margin-top: 0;
            font-size: 1rem;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* --- FIX: PARTNER LIST (RIGID HEIGHT) --- */
        #partner-box {
            flex: 0 0 140px;
            /* Fixed Height: 140px (Won't grow, Won't shrink) */
            height: 140px;
            display: flex;
            flex-direction: column;
        }

        #user-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex: 1;
            scrollbar-width: thin;
            /* Modern thin scrollbar */
        }

        .user-item {
            display: flex;
            align-items: center;
            padding: 8px;
            margin-bottom: 5px;
            background: #252830;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .user-avatar {
            width: 20px;
            height: 20px;
            background: var(--accent-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            margin-right: 8px;
            color: white;
            font-size: 0.7rem;
        }

        /* CHAT CONTAINER (Fills Remaining Space) */
        #chat-container {
            flex: 1;
            min-height: 200px;
            /* Ensures chat never disappears */
        }

        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            background: #000;
            border-radius: 8px;
            margin-bottom: 5px;
            border: 1px solid #333;
            scrollbar-width: thin;
        }

        .message {
            margin-bottom: 6px;
            font-size: 0.85rem;
            word-wrap: break-word;
        }

        .message span {
            font-weight: bold;
            color: var(--accent-color);
            margin-right: 5px;
        }

        .message.system {
            color: #888;
            font-style: italic;
            font-size: 0.75rem;
        }

        #typing-indicator {
            font-size: 0.75rem;
            color: var(--accent-color);
            font-style: italic;
            min-height: 15px;
            margin-bottom: 5px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #chat-input-area {
            display: flex;
            gap: 5px;
        }

        #chatInput {
            margin: 0;
            padding: 8px;
            font-size: 0.9rem;
        }

        #sendBtn {
            width: auto;
            margin: 0;
            padding: 0 15px;
        }

        .emoji-bar {
            display: flex;
            gap: 2px;
        }

        .btn-emoji {
            background: transparent;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.1s;
            padding: 2px;
            filter: grayscale(0.5);
        }

        .btn-emoji:hover {
            transform: scale(1.3);
            filter: grayscale(0);
        }

        .btn-emoji:active {
            transform: scale(0.9);
        }

        #blocker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        #toast-area {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 999;
        }

        .toast {
            padding: 15px 20px;
            margin-bottom: 10px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            animation: slideIn 0.3s forwards;
        }

        .bg-green {
            background: var(--success-color);
        }

        .bg-red {
            background: var(--error-color);
        }

        .bg-blue {
            background: var(--accent-color);
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .container {
                margin-top: 60px;
                height: calc(100vh - 60px);
                flex-direction: column;
                width: 100%;
                gap: 10px;
            }

            #player-ui {
                flex-direction: column;
                gap: 5px;
            }

            .video-section {
                flex: 0 0 auto;
                width: 100%;
            }

            .sidebar-section {
                flex: 1;
                max-width: 100%;
                min-height: 0;
                gap: 5px;
                padding-bottom: 5px;
            }

            .sidebar-box {
                padding: 10px;
            }

            /* Mobile adjustment */
            #partner-box {
                flex: 0 0 100px;
                height: 100px;
            }

            /* Fixed 100px on mobile */
            .logo {
                font-size: 1.1rem;
            }
        }

        /* Short Window Fix (Floating Mode) */
        @media (max-height: 600px) {
            .container {
                margin-top: 50px;
                height: calc(100vh - 50px);
            }

            header {
                padding: 5px 0;
            }

            /* Force layout stability even in small windows */
            #partner-box {
                flex: 0 0 100px;
                height: 100px;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
            }

            to {
                transform: translateX(0);
            }
        }
    </style>
</head>

<body>

    <div id="welcome-modal">
        <div class="modal-content">
            <h1>❤️ Couple Video Player</h1>
            <div class="owner-badge">Created by Sabyasachi</div>
            <p>Welcome to your private space.<br>Sync movies, reactions, and chat.</p>
            <button class="btn-primary" onclick="closeModal()"
                style="width: 100%; font-size: 1.1rem; padding: 15px;">Get Started</button>
        </div>
    </div>

    <audio id="notif-sound" src="data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU"></audio>

    <header>
        <div class="logo"><span>❤️</span> Couple Video Player</div>
        <div class="header-right">
            <a href="/about.html"
                style="color: #aaa; text-decoration: none; font-size: 0.9rem; font-weight: 600;">About</a>
            <div style="display: flex; align-items: center;">
                <span id="status-dot" class="status-dot"></span>
                <div class="user-welcome hidden" id="header-user-info">Hi, <b id="display-username">User</b></div>
            </div>
        </div>
    </header>

    <div id="toast-area"></div>

    <div class="container">
        <div id="login-screen">
            <h2>Start Your Date Night</h2>
            <input type="text" id="username" placeholder="Your Name">
            <input type="text" id="roomId" placeholder="Room Name">
            <button class="btn-primary" onclick="enterRoom(true)">Create Room</button>
            <button class="btn-secondary" onclick="enterRoom(false)">Join Room</button>
        </div>

        <div id="player-ui" class="hidden">
            <div class="video-section">
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px; padding: 0 5px;">
                    <div style="font-weight: 600; color: #888; font-size: 0.9rem;">Room: <span id="room-title"
                            style="color:white;">...</span></div>
                    <input type="file" id="fileInput" accept="video/*" style="width: auto; padding: 5px; margin: 0;">
                </div>
                <div id="video-wrapper">
                    <div id="hearts-container"></div>
                    <div id="blocker">
                        <h2 id="blocker-msg">Waiting for Video</h2>
                        <p id="blocker-sub">Select a local video file to start.</p>
                    </div>
                    <video id="videoPlayer" controls></video>
                </div>
            </div>

            <div class="sidebar-section">
                <div id="partner-box" class="sidebar-box">
                    <h3>👥 Partners</h3>
                    <ul id="user-list"></ul>
                </div>

                <div id="chat-container" class="sidebar-box">
                    <h3>
                        💬 Chat
                        <div class="emoji-bar">
                            <button class="btn-emoji" onclick="sendReaction('😂')">😂</button>
                            <button class="btn-emoji" onclick="sendReaction('😢')">😢</button>
                            <button class="btn-emoji" onclick="sendReaction('😲')">😲</button>
                            <button class="btn-emoji" onclick="sendReaction('❤️')">❤️</button>
                        </div>
                    </h3>

                    <div id="chat-messages"></div>
                    <div id="typing-indicator">Partner is typing...</div>

                    <div id="chat-input-area">
                        <input type="text" id="chatInput" placeholder="Type a message...">
                        <button id="sendBtn" class="btn-primary" onclick="sendMessage()">➤</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <script>
        let stompClient = null;
        let currentRoom = "";
        let username = "";
        let isRemoteUpdate = false;
        let typingTimeout = null;

        const blocker = document.getElementById('blocker');
        const blockerMsg = document.getElementById('blocker-msg');
        const blockerSub = document.getElementById('blocker-sub');
        const player = document.getElementById('videoPlayer');
        const statusDot = document.getElementById('status-dot');
        const notifSound = new Audio("https://codeskulptor-demos.commondatastorage.googleapis.com/pang/pop.mp3");

        function closeModal() { document.getElementById('welcome-modal').style.display = 'none'; }

        async function enterRoom(isCreating) {
            username = document.getElementById('username').value || "Guest";
            currentRoom = document.getElementById('roomId').value;
            if (!currentRoom) return showToast("Enter a room name", "bg-red");
            try {
                if (isCreating) {
                    const response = await fetch('/api/create-room', { method: 'POST', body: currentRoom });
                    if (response.status === 409) return showToast("Room already exists!", "bg-red");
                    if (response.ok) connect();
                } else {
                    const res = await fetch('/api/check-room/' + currentRoom);
                    const exists = await res.json();
                    if (exists) connect();
                    else showToast("Room not found!", "bg-red");
                }
            } catch (e) { showToast("Server Error", "bg-red"); }
        }

        function connect() {
            const socket = new SockJS('/ws-video');
            stompClient = Stomp.over(socket);
            stompClient.connect({}, function () {
                statusDot.classList.add('online');
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('player-ui').classList.remove('hidden');
                document.getElementById('header-user-info').classList.remove('hidden');
                document.getElementById('display-username').innerText = username;
                document.getElementById('room-title').innerText = currentRoom;

                stompClient.subscribe('/topic/room/' + currentRoom, onMessageReceived);
                stompClient.send("/app/room/" + currentRoom + "/join", {}, JSON.stringify({
                    type: 'JOIN', sender: username, time: 0.0, duration: 0.0
                }));
            }, function (error) {
                statusDot.classList.remove('online');
                statusDot.classList.add('offline');
                showToast("Connection Lost!", "bg-red");
            });
        }

        document.getElementById('fileInput').onchange = function (e) {
            const file = e.target.files[0];
            if (!file) return;
            player.src = URL.createObjectURL(file);
            document.getElementById('blocker-msg').innerText = "Verifying...";
            player.onloadedmetadata = function () {
                let dur = player.duration;
                if (!isFinite(dur) || isNaN(dur)) dur = 0.0;
                stompClient.send("/app/room/" + currentRoom + "/file-check", {}, JSON.stringify({
                    type: 'FILE_INFO', sender: username, duration: dur, time: 0.0
                }));
            };
        };

        function onMessageReceived(payload) {
            const data = JSON.parse(payload.body);
            if (data.activeUsers) updateUserList(data.activeUsers);

            if (data.type === 'REACTION') {
                showFloatingEmoji(data.text);
            }
            else if (data.type === 'TYPING' && data.sender !== username) {
                showTypingIndicator(data.sender);
            }
            else if (data.type === 'CHAT') {
                addChatMessage(data.sender, data.text);
                if (data.sender !== username) playSound();
            }
            else if (data.type === 'JOIN') {
                showToast(data.sender + " joined!", "bg-blue");
                addChatMessage("System", data.sender + " joined the room.");
            }
            else if (data.type === 'LEAVE') {
                showToast(data.sender + " left.", "bg-red");
                addChatMessage("System", data.sender + " left the room.");
                player.pause();
                blockerMsg.innerText = "Partner Left";
                blockerSub.innerText = "Video paused. Waiting for them to return.";
                blocker.classList.remove('hidden');
            }
            else if (data.type === 'WAIT') {
                document.getElementById('blocker-msg').innerText = "Waiting for Partner";
            }
            else if (data.type === 'ERROR') {
                document.getElementById('blocker-msg').innerText = "Video Mismatch";
            }
            else if (data.type === 'READY') {
                blocker.classList.add('hidden');
                showToast("Synced & Ready!", "bg-green");
            }
            else if (data.type === 'SYNC' && data.sender !== username) {
                isRemoteUpdate = true;
                if (Math.abs(player.currentTime - data.time) > 0.5) player.currentTime = data.time;
                if (data.action === 'PLAY') player.play();
                if (data.action === 'PAUSE') player.pause();
                showToast(data.sender + " " + data.action, "bg-blue");
                setTimeout(() => isRemoteUpdate = false, 300);
            }
        }

        function sendReaction(emoji) {
            stompClient.send("/app/room/" + currentRoom + "/reaction", {}, JSON.stringify({
                type: 'REACTION', sender: username, text: emoji, time: 0.0, duration: 0.0
            }));
            showFloatingEmoji(emoji);
        }

        function showFloatingEmoji(emojiChar) {
            const container = document.getElementById('hearts-container');
            const el = document.createElement('div');
            el.classList.add('floating-emoji');
            el.innerText = emojiChar;
            el.style.left = (Math.random() * 80 + 10) + "%";
            container.appendChild(el);
            setTimeout(() => { el.remove(); }, 3000);
        }

        const chatInput = document.getElementById('chatInput');
        chatInput.addEventListener('input', () => {
            stompClient.send("/app/room/" + currentRoom + "/typing", {}, JSON.stringify({
                type: 'TYPING', sender: username, text: "typing", time: 0.0, duration: 0.0
            }));
        });

        let typingHideTimeout;
        function showTypingIndicator(senderName) {
            const indicator = document.getElementById('typing-indicator');
            indicator.innerText = senderName + " is typing...";
            indicator.style.opacity = 1;

            clearTimeout(typingHideTimeout);
            typingHideTimeout = setTimeout(() => {
                indicator.style.opacity = 0;
            }, 1500);
        }

        function playSound() {
            notifSound.play().catch(e => console.log("Audio play failed"));
        }

        function sendMessage() {
            const msg = chatInput.value;
            if (!msg) return;
            stompClient.send("/app/room/" + currentRoom + "/chat", {}, JSON.stringify({
                type: 'CHAT', sender: username, text: msg, time: 0.0, duration: 0.0
            }));
            chatInput.value = "";
        }

        chatInput.addEventListener("keypress", function (event) {
            if (event.key === "Enter") sendMessage();
        });

        function addChatMessage(sender, text) {
            const div = document.createElement('div');
            const isSystem = sender === "System";
            div.className = isSystem ? "message system" : "message";
            div.innerHTML = isSystem ? text : `<span>${sender}:</span> ${text}`;
            const box = document.getElementById('chat-messages');
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function updateUserList(users) {
            const list = document.getElementById("user-list");
            list.innerHTML = "";
            users.forEach(u => {
                const li = document.createElement("li");
                li.className = "user-item";
                const initial = u.charAt(0).toUpperCase();
                li.innerHTML = `<div class="user-avatar">${initial}</div> ${u}`;
                list.appendChild(li);
            });
        }

        player.onplay = () => sendSync('PLAY');
        player.onpause = () => sendSync('PAUSE');

        function sendSync(action) {
            if (isRemoteUpdate || !blocker.classList.contains('hidden')) return;
            stompClient.send("/app/room/" + currentRoom + "/sync", {}, JSON.stringify({
                type: 'SYNC', sender: username, action: action,
                time: player.currentTime, duration: player.duration || 0.0
            }));
        }

        function showToast(msg, bgClass) {
            const div = document.createElement('div');
            div.className = "toast " + bgClass;
            div.innerHTML = msg;
            document.getElementById('toast-area').appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }
    </script>
</body>

</html>
